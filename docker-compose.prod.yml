services:
  backend:
    image: ghcr.io/spikk-hq/excalidash-backend:latest
    container_name: excalidash-backend
    # Run an init process (PID 1) that reaps zombies and forwards SIGTERM/SIGINT
    # to node so graceful shutdown (io.close / prisma.$disconnect) actually runs.
    init: true
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:6767}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - ENFORCE_HTTPS_REDIRECT=${ENFORCE_HTTPS_REDIRECT:-true}
      # Optional S3-compatible storage. Leave all of these unset to store
      # drawing files in the SQLite-backed volume.
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-excalidash}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      # Optional for single-instance deployments:
      # if unset, backend auto-generates and persists one in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      # Optional OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced)
      # - OIDC_PROVIDER_NAME=Authentik
      # - OIDC_ISSUER_URL=https://auth.example.com/application/o/excalidash/
      # - OIDC_CLIENT_ID=your-client-id
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=https://excalidash.example.com/api/auth/oidc/callback
      # Optional scheduled SQLite backups (see docs/DEPLOYMENT.md > Backups).
      # BACKUP_SCHEDULE is a 5- or 6-field cron expression; unset disables it.
      # Uncomment these together with the backup-data volume mount below.
      # - BACKUP_SCHEDULE=0 0 4 * * *
      # - BACKUP_DIR=/app/backups
      # - BACKUP_RETENTION_DAYS=14
    volumes:
      - backend-data:/app/prisma
      # Persist scheduled backups outside the container (pairs with BACKUP_DIR).
      # - backup-data:/app/backups
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/spikk-hq/excalidash-frontend:latest
    container_name: excalidash-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  # Uncomment to persist scheduled backups (see the backend service above).
  # backup-data:
